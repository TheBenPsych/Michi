name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install, test and build the web app
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
        env:
          APP_VERSION: 0.1.${{ github.run_number }}

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Michi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Michi-apk
          path: Michi.apk

      # On main, publish a GitHub Release so the APK can be downloaded straight from the phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Michi 0.1.${{ github.run_number }}
          body: Install Michi.apk on your Android phone. It updates over the previous version and keeps your progress.
          files: Michi.apk
          make_latest: true
